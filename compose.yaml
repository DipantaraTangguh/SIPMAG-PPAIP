services:
    app:
        build:
            context: .
            dockerfile: Dockerfile.dev
        container_name: sipmag-app
        restart: unless-stopped
        working_dir: /var/www
        volumes:
            - .:/var/www
            - vendor:/var/www/vendor
        ports:
            - "8000:8000"
        depends_on:
            # Tunggu MySQL benar-benar siap, bukan sekadar containernya jalan --
            # tanpa ini migrate saat boot pertama bisa gagal konek.
            mysql:
                condition: service_healthy

    vite:
        image: node:22
        container_name: sipmag-vite
        working_dir: /var/www
        volumes:
            - .:/var/www
            - node_modules:/var/www/node_modules
        ports:
            - "5173:5173"
        command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
        depends_on:
            - app

    mysql:
        image: mysql:8.4
        container_name: sipmag-mysql
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: sipmag
            MYSQL_ROOT_PASSWORD: admin
            MYSQL_USER: admin
            MYSQL_PASSWORD: admin
        ports:
            # Dibuka ke host supaya GUI database (TablePlus, DBeaver, dsb.)
            # bisa konek ke 127.0.0.1:3307. Pakai 3307 agar tidak bentrok
            # dengan MySQL yang mungkin sudah jalan di mesin sendiri.
            # Aplikasi di dalam container tetap memakai host "mysql" port 3306.
            - "3307:3306"
        volumes:
            - mysql_data:/var/lib/mysql
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-padmin"]
            interval: 5s
            timeout: 5s
            retries: 20
            start_period: 30s

    phpmyadmin:
        image: phpmyadmin:latest
        container_name: sipmag-phpmyadmin
        ports:
            - "8080:80"
        environment:
            PMA_HOST: mysql
            PMA_PORT: 3306
        depends_on:
            mysql:
                condition: service_healthy

volumes:
    mysql_data:
    vendor:
    node_modules:
