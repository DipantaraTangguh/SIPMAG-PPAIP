services:
    app:
        build:
            context: .
            dockerfile: Dockerfile.dev
        container_name: sipmag-app
        restart: unless-stopped
        working_dir: /var/www
        volumes:
            - .:/var/www
            - vendor:/var/www/vendor
        ports:
            - "8000:8000"
        depends_on:
            - mysql

    vite:
        image: node:22
        container_name: sipmag-vite
        working_dir: /var/www
        volumes:
            - .:/var/www
            - node_modules:/var/www/node_modules
        ports:
            - "5173:5173"
        command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
        depends_on:
            - app

    mysql:
        image: mysql:8.4
        container_name: sipmag-mysql
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: sipmag
            MYSQL_ROOT_PASSWORD: admin
            MYSQL_USER: admin
            MYSQL_PASSWORD: admin
        volumes:
            - mysql_data:/var/lib/mysql

volumes:
    mysql_data:
    vendor:
    node_modules:
