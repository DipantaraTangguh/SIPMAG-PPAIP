# Port-nya ditulis __PORT__ dan diganti entrypoint saat container start.
# Render menentukan port lewat environment variable PORT (bawaan 10000) dan
# nilainya baru diketahui saat runtime, bukan saat image dibangun.
<VirtualHost *:__PORT__>
    DocumentRoot /var/www/public

    <Directory /var/www/public>
        AllowOverride All
        Require all granted
        Options -Indexes +FollowSymLinks
    </Directory>

    # public/storage adalah symlink ke storage/app/public (logo perusahaan).
    # Apache menolak mengikuti symlink lintas pemilik kecuali diizinkan.
    <Directory /var/www/storage/app/public>
        AllowOverride None
        Require all granted
    </Directory>

    ErrorLog /dev/stderr
    # Health check Render memukul /up tiap beberapa detik; tanpa disaring,
    # log akses jadi penuh baris itu saja dan sulit dibaca.
    SetEnvIf Request_URI "^/up$" no_access_log
    CustomLog /dev/stdout combined env=!no_access_log
</VirtualHost>
